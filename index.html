}

  const c=COURSES.find(x=>x.id===courseId);

  const link=upiLink(c);
  window.location.href=link;
}
function returnToQuizIfPending(){
  const id=pendingQuizCourseId || sessionStorage.getItem("pendingQuizCourse");
  if(!id) return;
  const c=COURSES.find(x=>x.id===id);
  if(!c) return;
  // When the UPI app returns focus to the browser, open the quiz automatically.
  if(document.visibilityState==="visible" && state.user){
    sessionStorage.removeItem("pendingQuizCourse");
    pendingQuizCourseId=null;
    startQuiz(c);
  }
}

async function startCashfreePayment(id){
  const c=COURSES.find(x=>x.id===id); if(!c)return;
  const st=student(); if(!st){register();return;}
  const btn=document.getElementById("cashfreePayBtn"), status=document.getElementById("cashfreeStatus");
  if(btn){btn.disabled=true;btn.textContent="Creating secure payment…";}
  if(status)status.textContent="Please wait…";
  try{
    const cfg=window.SKILLCERT_CASHFREE||{};
    if(!cfg.CREATE_ORDER_URL || cfg.CREATE_ORDER_URL.includes("YOUR_SUPABASE")) throw new Error("Cashfree backend URL is not configured yet. Set CREATE_ORDER_URL in skillcert-cashfree-config.js.");
    const response=await fetch(cfg.CREATE_ORDER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({courseId:c.id,courseName:c.name,amount:c.price,customer:{id:st.id,name:st.name,email:st.email,phone:st.phone||"9999999999"},returnUrl:window.location.origin+window.location.pathname+"?cashfree_return=1"})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||data.message||"Unable to create Cashfree order");
    if(!data.payment_session_id)throw new Error("Cashfree did not return a payment session.");
    sessionStorage.setItem("pendingCashfreeOrder",data.order_id||"");
    const cashfree=Cashfree({mode:(cfg.MODE||"sandbox")});
    await cashfree.checkout({paymentSessionId:data.payment_session_id,redirectTarget:"_self"});
  }catch(err){
    if(status)status.innerHTML='<span class="error">'+esc(err.message||"Payment could not be started.")+'</span>';
    if(btn){btn.disabled=false;btn.textContent="Try Payment Again";}
  }
}
async function handleCashfreeReturn(){
  const params=new URLSearchParams(window.location.search), orderId=params.get("order_id");
  if(!orderId)return;
  history.replaceState({},document.title,window.location.pathname);
  const cfg=window.SKILLCERT_CASHFREE||{};
  shell(`<div class="auth"><div class="card payment"><span class="eyebrow">VERIFYING PAYMENT</span><h1>Please wait…</h1><p>We are securely checking your Cashfree payment. Please do not refresh.</p><div class="amount">₹149</div><div id="cashfreeVerifyStatus" class="small">Checking order ${esc(orderId)}…</div></div></div>`);
  try{
    if(!cfg.VERIFY_ORDER_URL || cfg.VERIFY_ORDER_URL.includes("YOUR_SUPABASE"))throw new Error("Cashfree verification URL is not configured.");
    const response=await fetch(cfg.VERIFY_ORDER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||data.message||"Payment verification failed");
    if(data.status!=="PAID")throw new Error("Payment status: "+(data.status||"NOT PAID"));
    const courseId=data.courseId||sessionStorage.getItem("pendingQuizCourse");
    const st=student(); if(!st)throw new Error("Student session not found. Please log in again.");
    const c=COURSES.find(x=>x.id===courseId); if(!c)throw new Error("Course not found for this payment.");
    if(!st.purchases.includes(courseId))st.purchases.push(courseId);
    state.orders.push({id:orderId,studentId:st.id,courseId,amount:c.price,status:"paid",date:new Date().toISOString()});
    save();
    shell(`<div class="result"><div class="result-icon">✓</div><h1>Payment Successful</h1><div class="score">₹${c.price}</div><p class="success">Your payment was verified successfully.</p><p>You can now start the <b>${esc(c.name)}</b> quiz.</p><button class="cta" onclick="startQuiz('${c.id}')">Start Quiz</button><button class="outline" onclick="dashboard()">Dashboard</button></div>`);
  }catch(err){
    shell(`<div class="result"><div class="result-icon error">!</div><h1>Payment Not Confirmed</h1><p class="error">${esc(err.message||"We could not verify this payment yet.")}</p><p>If your bank account was debited, keep the Cashfree order ID <b>${esc(orderId)}</b> and contact support. Do not make another payment until the status is checked.</p><button class="cta" onclick="dashboard()">Dashboard</button></div>`);
  }
}
let quiz=null,timer=null;
function startQuiz(id){let c=COURSES.find(x=>x.id===id),qs=[...c.questions].sort(()=>Math.random()-.5).slice(0,state.settings.questions);quiz={course:c,qs,i:0,ans:[],left:state.settings.time*60};renderQuiz();clearInterval(timer);timer=setInterval(()=>{quiz.left--;let el=document.getElementById("timer");if(el)el.textContent=`${Math.floor(quiz.left/60)}:${String(quiz.left%60).padStart(2,"0")}`;if(quiz.left<=0){clearInterval(timer);finishQuiz()}},1000)}
function renderQuiz(){let q=quiz.qs[quiz.i],sel=quiz.ans[quiz.i];shell(`<div class="quiz"><div class="quizbar"><div><span class="eyebrow">${quiz.course.name}</span><b>Question ${quiz.i+1}/${quiz.qs.length}</b></div><strong id="timer">${Math.floor(quiz.left/60)}:${String(quiz.left%60).padStart(2,"0")}</strong></div><div class="progress"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div><div class="card quiz-card"><h2>${esc(q[0])}</h2>${q[1].map((o,j)=>`<button class="option ${sel===j?"selected":""}" onclick="answer(${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}<div class="quiz-actions"><button class="outline" onclick="dashboard()">Exit</button><button class="cta" onclick="nextQ()">${quiz.i===quiz.qs.length-1?"Submit":"Next"}</button></div></div></div>`)}
function answer(j){quiz.ans[quiz.i]=j;renderQuiz()}
function nextQ(){if(quiz.ans[quiz.i]===undefined)return alert("Please select an answer.");if(quiz.i<quiz.qs.length-1){quiz.i++;renderQuiz()}else finishQuiz()}
function finishQuiz(){clearInterval(timer);let correct=quiz.qs.reduce((n,q,i)=>n+(quiz.ans[i]===q[2]?1:0),0),score=Math.round(correct/quiz.qs.length*100),st=student();state.attempts.push({studentId:st.id,courseId:quiz.course.id,score,date:new Date().toISOString()});if(score>=state.settings.pass){let cert={id:"CERT-"+Date.now().toString(36).toUpperCase(),studentId:st.id,courseId:quiz.course.id,courseName:quiz.course.name,score,date:new Date().toISOString()};state.certs.push(cert);save();result(score,cert)}else{save();result(score,null)}}
function result(score,cert){shell(`<div class="result"><div class="result-icon">${cert?"✓":"!"}</div><h1>${cert?"Congratulations!":"Keep Practicing"}</h1><div class="score">${score}%</div><p>Pass mark: ${state.settings.pass}%</p>${cert?`<p class="success">You passed ${esc(quiz.course.name)}.</p><button class="cta" onclick="showCert('${cert.id}')">View Certificate</button>`:`<p>You did not reach the passing score.</p><button class="cta" onclick="startQuiz('${quiz.course.id}')">Retake Quiz</button>`}<button class="outline" onclick="dashboard()">Dashboard</button></div>`)}
function showCert(id){let c=state.certs.find(x=>x.id===id),st=studentBy(c.studentId);shell(`<div class="certificate"><div class="cert-brand">SKILL<span>CERT</span> HUB</div><div class="cert-title">Certificate of Achievement</div><p>This certificate is proudly presented to</p><div class="cert-name">${esc(st.name)}</div><p>for successfully passing the</p><h2>${esc(c.courseName)} Certification Assessment</h2><p>Score: <b>${c.score}%</b></p><div class="cert-line"></div><div class="cert-info"><span>Certificate ID<br><b>${c.id}</b></span><span>Date<br><b>${new Date(c.date).toLocaleDateString()}</b></span></div><button class="cta print" onclick="window.print()">Print / Save PDF</button></div>`)}
function verify(){shell(`<div class="auth"><div class="card"><h1>Verify Certificate</h1><p>Enter the certificate ID.</p><form onsubmit="doVerify(event)"><label>Certificate ID<input id="cid" placeholder="CERT-..." required></label><button class="cta full">Verify</button></form><div id="vr"></div></div></div>`)}
function doVerify(e){e.preventDefault();let c=state.certs.find(x=>x.id===document.getElementById("cid").value.trim().toUpperCase()),r=document.getElementById("vr");if(!c){r.innerHTML='<p class="error">Certificate not found.</p>';return}let st=studentBy(c.studentId);r.innerHTML=`<div class="verified"><b>✓ Valid Certificate</b><p>Student: ${esc(st.name)}</p><p>Course: ${esc(c.courseName)}</p><p>Score: ${c.score}%</p><p>Issued: ${new Date(c.date).toLocaleDateString()}</p></div>`}
function student(){return studentBy(state.session)} function studentBy(id){return state.students.find(x=>x.id===id)}
function logout(){state.session=null;save();home()}
if(new URLSearchParams(window.location.search).get("cashfree_return")==="1"){handleCashfreeReturn();}else{home();}</script><!-- UPI merchant ID is not displayed in the public UI. For true server-side secrecy, use a payment gateway/backend rather than a client-side UPI URI. --><button class="floating-home" onclick="home()" aria-label="Home">⌂</button>
<script>
/* SkillCert Hub — MSG91 + Supabase registration integration
   The MSG91 AuthKey remains server-side in the Supabase Edge Function.
   Replace the placeholders below with your Supabase project URL and anon key.
*/
window.SKILLCERT_CONFIG = {
  supabaseUrl: "YOUR_SUPABASE_PROJECT_URL",
  supabaseAnonKey: "YOUR_SUPABASE_ANON_KEY",
  msg91WidgetId: "366873697a33313031373639",
  msg91VerifyFunction: "verify-msg91-otp"
};

async function verifySkillCertMsg91Token(accessToken) {
  const c = window.SKILLCERT_CONFIG;
  if (!accessToken) throw new Error("MSG91 verification token missing.");
  if (c.supabaseUrl.includes("YOUR_") || c.supabaseAnonKey.includes("YOUR_")) {
    throw new Error("Add your Supabase URL and anon key in SKILLCERT_CONFIG.");
  }
  const r = await fetch(c.supabaseUrl + "/functions/v1/" + c.msg91VerifyFunction, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": c.supabaseAnonKey,
      "Authorization": "Bearer " + c.supabaseAnonKey
    },
    body: JSON.stringify({ accessToken })
  });
  const data = await r.json();
  if (!r.ok || !data.verified) throw new Error(data.error || "Mobile verification failed.");
  return data;
}

async function createSkillCertStudent(profile) {
  const c = window.SKILLCERT_CONFIG;
  const r = await fetch(c.supabaseUrl + "/rest/v1/skillcert_students", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": c.supabaseAnonKey,
      "Authorization": "Bearer " + c.supabaseAnonKey,
      "Prefer": "return=representation"
    },
    body: JSON.stringify(profile)
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(t || "Could not create student profile.");
  }
  return r.json();
}

/* Call this from the MSG91 widget success callback:
   window.skillCertOtpSuccess(data, registrationData)
*/
window.skillCertOtpSuccess = async function(data, registrationData) {
  try {
    const accessToken =
      data?.token || data?.accessToken || data?.["access-token"] ||
      data?.message?.token || data?.message?.accessToken;
    await verifySkillCertMsg91Token(accessToken);

    const profile = {
      full_name: registrationData.full_name,
      email: registrationData.email || null,
      mobile: registrationData.mobile,
      mobile_verified: true
    };

    await createSkillCertStudent(profile);
    localStorage.setItem("skillcert_student", JSON.stringify(profile));
    alert("✅ Mobile verified! Your SkillCert Hub account is ready.");
    if (typeof dashboard === "function") dashboard();
  } catch (e) {
    console.error(e);
    alert("Verification failed: " + e.message);
  }
};
</script>

window.startSkillCertMobileVerification = function(registrationData) {
  if (!window.SKILLCERT_MSG91_CLIENT_TOKEN ||
      window.SKILLCERT_MSG91_CLIENT_TOKEN === "PASTE_MSG91_CLIENT_TOKEN_HERE") {
    alert("MSG91 is not configured yet. Add the Client Token in skillcert-msg91-config.js.");
    return;
  }

  if (!registrationData || !registrationData.mobile || !registrationData.full_name) {
    alert("Please enter your full name and mobile number.");
    return;
  }
  const configuration = {
    widgetId: window.SKILLCERT_CONFIG.msg91WidgetId,
    tokenAuth: window.SKILLCERT_MSG91_CLIENT_TOKEN, // MSG91 CLIENT token only; never put AuthKey here.
    identifier: registrationData.mobile,
    exposeMethods: true,
    success: (data) => window.skillCertOtpSuccess(data, registrationData),
    failure: (error) => {
      console.error("MSG91 OTP failure", error);
      alert("OTP verification failed. Please try again.");
    }
  };
  if (typeof window.initSendOTP === "function") {
    window.initSendOTP(configuration);
  } else {
    alert("MSG91 OTP widget is still loading. Please try again.");
  }
};
